<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAHIA | Menú</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <svg class="side-decoration left-decoration" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 20 L85 20 L50 60 Z" fill="none" stroke="#D4AF37" stroke-width="2" stroke-linejoin="round"/>
        <path d="M28 35 L72 35 L50 58 Z" fill="#D4AF37" fill-opacity="0.1" stroke="#D4AF37" stroke-width="1"/>
        
        <line x1="50" y1="60" x2="50" y2="110" stroke="#D4AF37" stroke-width="2"/>
        <line x1="30" y1="110" x2="70" y2="110" stroke="#D4AF37" stroke-width="2" stroke-linecap="round"/>
        
        <line x1="45" y1="50" x2="25" y2="5" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round"/>
        
        <circle cx="85" cy="20" r="12" fill="#0B0C0A" stroke="#D4AF37" stroke-width="1.5"/>
        <circle cx="85" cy="20" r="9" fill="none" stroke="#D4AF37" stroke-width="0.5"/>
        <line x1="85" y1="8" x2="85" y2="32" stroke="#D4AF37" stroke-width="0.5"/>
        <line x1="73" y1="20" x2="97" y2="20" stroke="#D4AF37" stroke-width="0.5"/>
        <line x1="76" y1="11" x2="94" y2="29" stroke="#D4AF37" stroke-width="0.5"/>
        <line x1="76" y1="29" x2="94" y2="11" stroke="#D4AF37" stroke-width="0.5"/>
        
        <path d="M10 40 Q 15 40 15 35 Q 15 40 20 40 Q 15 40 15 45 Q 15 40 10 40 Z" fill="#D4AF37" opacity="0.6"/>
        <path d="M85 75 Q 88 75 88 72 Q 88 75 91 75 Q 88 75 88 78 Q 88 75 85 75 Z" fill="#D4AF37" opacity="0.6"/>
        <path d="M25 90 Q 27 90 27 88 Q 27 90 29 90 Q 27 90 27 92 Q 27 90 25 90 Z" fill="#D4AF37" opacity="0.6"/>
    </svg>

    <div class="container">
        <header class="minimal-hero">
            <img src="logo.png" alt="Logo BAHIA" class="brand-logo">
            <h1 class="brand-title">BAHIA</h1>
            <p class="brand-subtitle">Sabor que te transporta</p>
        </header> 
        
        <main class="menu-content">
            <nav class="tabs">
                <button class="tab-btn active" data-tab="Sandwich">Sandwich</button>
                <button class="tab-btn" data-tab="Naturales">Jugos Naturales</button>              
                <button class="tab-btn" data-tab="Bebidas">Otras Bebidas</button>
                <button class="tab-btn" data-tab="Adiciones">Adiciones</button>
            </nav>

            <div id="loader" class="loader">Preparando delicias...</div>
            <section id="Sandwich" class="menu-section active"></section>
            <section id="Naturales" class="menu-section"></section>
            <section id="Bebidas" class="menu-section"></section>
            <section id="Adiciones" class="menu-section"></section>
        </main> 
        
        <footer class="compact-footer">
            <a href="https://www.instagram.com/fruta_fresca_tolu" target="_blank" class="compact-ig-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                Síguenos
            </a>
            <div class="sarlab-compact">
                <p>Desarrollado por <strong>SARLAB</strong> Medellín</p>
            </div>
        </footer>
    </div> 
    
    <div class="cart-fab" onclick="toggleCart()">
        <span id="cart-count">0</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
    </div>

    <div id="cart-modal" class="cart-modal">
        <div class="cart-header">
            <h3>Tu Pedido</h3>
            <button class="close-cart" onclick="toggleCart()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div class="cart-items-list" id="cart-items"></div>
        <div class="cart-footer">
            <div class="total-row"><span>TOTAL:</span><span id="cart-total-price">$0</span></div>
            <div class="order-form">
                <select id="tipo-servicio" onchange="ajustarPlaceholder()">
                    <option value="mesa">🍽️ Mesa (Comer aquí)</option>
                    <option value="domicilio">🛵 Domicilio</option>
                </select>
                <input type="text" id="nombre-cliente" placeholder="Nombre y # de Mesa">
                <p style="font-size: 0.75rem; color: #94a3b8; text-align: center; margin-bottom: 12px;">Paga en caja al recibir tu pedido 💵</p>
                <div class="whatsapp-check">
                    <input type="checkbox" id="check-whatsapp">
                    <label for="check-whatsapp">Respaldo por WhatsApp</label>
                </div>
            </div>
            <button class="btn-send-order" onclick="enviarPedido()">CONFIRMAR PEDIDO</button>
        </div>
    </div>

    <div id="tracker-modal" class="cart-modal">
        <div class="cart-header">
            <h3>Estado de tu Pedido</h3>
            <button class="close-cart" onclick="cerrarTracker()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
        </div>
        <div style="padding: 50px 20px; text-align: center;">
            <div id="tracker-icon" style="font-size: 4rem; margin-bottom: 20px;">📥</div>
            <h2 id="tracker-status" style="font-size: 2rem; margin-bottom: 10px;">Recibido</h2>
            <p id="tracker-desc" style="color: #64748b;">Tu pedido ha sido enviado a la cocina.</p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
    <script>
        function ajustarPlaceholder() {
            const tipo = document.getElementById('tipo-servicio').value;
            const input = document.getElementById('nombre-cliente');
            input.placeholder = (tipo === 'mesa') ? "Nombre y # de Mesa" : "Nombre y Dirección exacta";
        }
    </script>
</body>
</html>
